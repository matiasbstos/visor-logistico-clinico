<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fotos de productos · SAR</title>
    <meta name="apple-mobile-web-app-title" content="Fotos SAR">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1A3668">
    <link rel="manifest" href="manifest-fotos.json">
    <link rel="icon" href="assets/icon-fotos-192.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon-fotos.png">
    <link rel="stylesheet" href="style.css?v=21.249">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
    <style>
        body.ft { margin: 0; background: #f5f7fb; font-family: 'Outfit', system-ui, sans-serif; min-height: 100vh; }
        .ft-cab { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #E2E8F0; box-shadow: 0 2px 8px rgba(15,23,42,.06); }
        .ft-cab img { height: 40px; width: 40px; border-radius: 10px; }
        .ft-cab div { flex: 1; line-height: 1.15; } .ft-cab b { color: #1A3668; font-size: 1rem; display: block; } .ft-cab small { color: #64748b; font-size: .75rem; }
        .ft-cab button { border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; padding: 6px 10px; font-size: .8rem; color: #334155; }
        .ft-wrap { max-width: 720px; margin: 0 auto; padding: 12px 16px 40px; }
        .ft-barra input { width: 100%; min-height: 46px; font-size: 1rem; }
        .ft-chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; }
        .ft-chip { flex: 0 0 auto; border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; padding: 8px 12px; font-size: .85rem; min-height: 40px; }
        .ft-chip.on { background: #1A3668; border-color: #1A3668; color: #fff; }
        .ft-p { background: #fff; border: 1px solid #e2e8f0; border-radius: var(--shape-card, 8px 8px 8px 0); padding: 12px; margin-top: 10px; }
        .ft-p header b { display: block; color: #0f172a; font-size: .95rem; line-height: 1.3; } .ft-p header small { color: #64748b; font-size: .78rem; }
        .ft-ped { color: #1A3668; font-weight: 700; }
        .ft-fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .ft-f { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 120px; border: 1px dashed #cbd5e1; border-radius: var(--shape-card, 8px 8px 8px 0); background: #f8fafc; font-size: .8rem; text-align: center; color: #1A3668; cursor: pointer; padding: 6px; }
        .ft-f.ok { border-style: solid; border-color: #8CC63F; background: #f7fbef; color: #4D7C0F; }
        .ft-f.ft-mas { border-color: #cbd5e1; background: #f8fafc; color: #334155; }
        .ft-f img { width: 100%; height: 80px; object-fit: contain; border-radius: 6px; background: #fff; }
        .ft-ico { font-size: 1.9rem; color: #1A3668; } .ft-sub { opacity: .5; pointer-events: none; }
        .ft-nada { text-align: center; color: #64748b; padding: 30px 16px; }
        .ft-login { max-width: 420px; margin: 8vh auto 0; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(15,23,42,.1); display: flex; flex-direction: column; gap: 12px; }
        .ft-login h1 { margin: 0; color: #1A3668; font-size: 1.3rem; } .ft-login p { margin: 0; color: #64748b; font-size: .9rem; } .ft-login .btn { min-height: 48px; font-size: 1rem; } .ft-err { color: #b91c1c; font-size: .85rem; min-height: 1em; }
        .sp-toasts { position: fixed; left: 16px; right: 16px; top: 12px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .sp-toast { pointer-events: auto; background: #1a3668; color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(15,23,42,.3); font-size: .9rem; } .sp-toast.error { background: #b91c1c; } .sp-toast.success { background: #4D7C0F; } .sp-toast.warning { background: #92400e; }
    </style>
</head>
<body class="ft" data-user-role="">
    <header class="ft-cab"><img src="assets/icon-fotos-192.png" alt=""><div><b>Fotos de productos</b><small>Producto y caja · SAR Elsa Romo</small></div><button type="button" id="ft-salir" hidden>Salir</button></header>
    <main id="ft-main"><p class="ft-nada" role="status">Abriendo Fotos SAR…</p></main>
    <script src="progreso.js?v=21.249"></script>
    <script src="fotos-telefono.js?v=21.249"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, setDoc, getDoc, getDocs, query, where, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        // Configuración pública del proyecto (la misma del visor; no es una clave secreta).
        const app = initializeApp({ apiKey: "AIzaSyAyktOnoB-j7nX4-YZLa6B74wOBCbZvlsA", authDomain: "sarinventario.firebaseapp.com", projectId: "sarinventario", storageBucket: "sarinventario.firebasestorage.app", messagingSenderId: "358257655117", appId: "1:358257655117:web:b7f46ad97e94afa1324b04" });
        const auth = getAuth(app), db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
        window.firebaseAuth = auth; window.firebaseDb = db;
        window.firebaseFirestore = { doc, collection, setDoc, getDoc, getDocs, query, where, limit, serverTimestamp };
        window.showToast = (t, m, tipo) => { const pila = document.getElementById('sp-toasts') || Object.assign(document.body.appendChild(document.createElement('div')), { id: 'sp-toasts', className: 'sp-toasts' }); const d = document.createElement('div'); d.className = 'sp-toast ' + (tipo || ''); d.textContent = t + (m ? ' · ' + m : ''); pila.appendChild(d); setTimeout(() => d.remove(), 4000); };
        const main = document.getElementById('ft-main'), salir = document.getElementById('ft-salir');
        const STAFF = ['superadmin'];   /* v21.241: sacar y cambiar fotos es solo del superadministrador */
        async function rolDe(u) { for (const id of [u.email, u.uid].filter(Boolean)) { try { const d = await getDoc(doc(db, 'Usuarios', id)); if (d.exists()) return String(d.data().rol || d.data().role || '').toLowerCase(); } catch (e) { /* sin permiso */ } } return ''; }
        function login(msg) {
            salir.hidden = true;
            main.innerHTML = '<form class="ft-login" id="ft-f"><h1>Fotos de productos</h1><p>Entra con tu cuenta del Visor. Queda guardada en este teléfono.</p><input class="form-control" id="ft-c" type="email" placeholder="Correo" autocomplete="username" required><input class="form-control" id="ft-k" type="password" placeholder="Clave" autocomplete="current-password" required><div class="ft-err" id="ft-e"></div><button class="btn btn-primary" type="submit">Entrar</button></form>';
            const e = main.querySelector('#ft-e'); if (msg) e.textContent = msg;
            main.querySelector('#ft-f').onsubmit = async (ev) => { ev.preventDefault(); e.textContent = ''; try { await signInWithEmailAndPassword(auth, main.querySelector('#ft-c').value.trim(), main.querySelector('#ft-k').value); } catch (x) { e.textContent = /network/i.test(String(x.code)) ? 'Sin internet.' : 'Correo o clave incorrectos.'; } };
        }
        salir.onclick = () => signOut(auth);
        onAuthStateChanged(auth, async (u) => {
            if (!u || u.isAnonymous) { login(); return; }
            const rol = await rolDe(u); document.body.dataset.userRole = rol;
            if (!STAFF.includes(rol)) { await signOut(auth); login('Esta cuenta no puede cargar fotos: solo el superadministrador.'); return; }
            salir.hidden = false; window.SAR_FotosTel.pagina(main);
        });
        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    </script>
</body>
</html>
